aid: candid-therapeutics
name: Candid Therapeutics
description: 'Candid Therapeutics is a San Diego, California clinical-stage biotechnology
  company developing T-cell engager (TCE) antibody therapies for autoimmune and inflammatory
  diseases. Launched publicly in September 2024 with a $370 million Series A financing
  and assembled by acquiring Vignette Bio and TRC 2004, Candid in-licenses differentiated
  bispecific TCE assets and advances them through US clinical development. Its approach
  redirects T-cells to selectively deplete autoreactive B-cells, aiming for deeper
  and more durable depletion than conventional antibody therapy without the manufacturing
  burden of cell therapy. Its lead investigational asset, cizutamig, is a BCMA x CD3
  bispecific antibody. UCB completed its acquisition of Candid Therapeutics on 17 June
  2026 for up to $2.2 billion ($2.0 billion upfront plus up to $200 million in milestones),
  and the company now operates as part of UCB. Candid Therapeutics publishes no public
  API, developer portal, SDK, or machine-readable specification.'
